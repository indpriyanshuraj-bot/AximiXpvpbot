name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build bridge pack
        run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: PracticeBridge
          path: dist/PracticeBridge.mcpack
          if-no-files-found: error
